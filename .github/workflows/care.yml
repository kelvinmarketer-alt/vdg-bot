name: VDG Care Report

on:
  schedule:
    # 3 nhịp dự phòng sáng VN (9:30 / 10:30 / 12:30) — GitHub hay trễ/bỏ nhịp;
    # có cache chống gửi trùng nên nhịp nào chạy trước thì gửi, nhịp sau tự bỏ qua.
    - cron: "30 2 * * *"   # 09:30 VN (02:30 UTC)
    - cron: "30 3 * * *"   # 10:30 VN (03:30 UTC)
    - cron: "30 5 * * *"   # 12:30 VN (05:30 UTC)
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD (test 1 ngày cụ thể; trống = hôm qua)"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Xác định ngày báo cáo (khóa cache chống trùng)
        id: key
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            D="${{ github.event.inputs.target_date }}"
          else
            D=$(TZ=Asia/Ho_Chi_Minh date -d 'yesterday' +%F)
          fi
          echo "date=$D" >> "$GITHUB_OUTPUT"
      - name: Khôi phục dấu 'đã gửi' của ngày
        uses: actions/cache@v4
        with:
          path: .state
          key: care-sent-${{ steps.key.outputs.date }}
      - name: Run care report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          STATE_DIR: .state
          # chạy tay (manual) thì luôn gửi, bỏ qua chống-trùng để re-send bản sửa
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python care_report.py
