name: VDG Care Report

on:
  schedule:
    # 3 nhịp dự phòng sáng VN (9:30 / 10:30 / 12:30) — GitHub hay trễ/bỏ nhịp;
    # có cache chống gửi trùng nên nhịp nào chạy trước thì gửi, nhịp sau tự bỏ qua.
    # CHỈ chạy THỨ 2→THỨ 7 (1-6), bỏ CHỦ NHẬT (nghỉ). Sáng T2 báo cáo cho THỨ 7.
    - cron: "30 2 * * 1-6"   # 09:30 VN (02:30 UTC)
    - cron: "30 3 * * 1-6"   # 10:30 VN (03:30 UTC)
    - cron: "30 5 * * 1-6"   # 12:30 VN (05:30 UTC)
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD (test 1 ngày cụ thể; trống = hôm qua)"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Khóa cache chống trùng theo ngày
        id: key
        env:
          MODE: daily
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          K=$(python -c "import care_report; print(care_report.resolve_period()[4])")
          echo "key=$K" >> "$GITHUB_OUTPUT"
      - name: Khôi phục dấu 'đã gửi' của ngày
        uses: actions/cache@v4
        with:
          path: .state
          key: ${{ steps.key.outputs.key }}
      - name: Run care report
        env:
          MODE: daily
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          STATE_DIR: .state
          # chạy tay (manual) thì luôn gửi, bỏ qua chống-trùng để re-send bản sửa
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python care_report.py
