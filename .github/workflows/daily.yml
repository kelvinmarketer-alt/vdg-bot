name: VDG Daily Combined Report

on:
  schedule:
    - cron: "30 1 * * *"   # 08:30 sáng VN (01:30 UTC) — sau fb-bot & Google Ads daily script
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD (test 1 ngày cụ thể; trống = hôm qua)"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Write service account
        run: echo '${{ secrets.GSA_JSON }}' > gsa.json
      - name: Run daily combined report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: python daily_combined.py
