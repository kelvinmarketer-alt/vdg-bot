name: VDG Care Weekly

on:
  schedule:
    # sáng THỨ 2 (9:30 / 10:30 / 12:30 VN) — tổng kết TUẦN vừa qua (T2→CN)
    - cron: "30 2 * * 1"
    - cron: "30 3 * * 1"
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      target_date:
        description: "YYYY-MM-DD mốc (trống = hôm nay; báo cáo TUẦN TRƯỚC mốc đó)"
        required: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Khóa cache chống trùng theo tuần
        id: key
        env:
          MODE: weekly
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          K=$(python -c "import care_report; print(care_report.resolve_period()[4])")
          echo "key=$K" >> "$GITHUB_OUTPUT"
      - name: Khôi phục dấu 'đã gửi' của tuần
        uses: actions/cache@v4
        with:
          path: .state
          key: ${{ steps.key.outputs.key }}
      - name: Run weekly report
        env:
          MODE: weekly
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_DATE: ${{ github.event.inputs.target_date }}
          STATE_DIR: .state
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python care_report.py
