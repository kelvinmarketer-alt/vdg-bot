name: VDG Weekly Report

on:
  # Chạy 3 lần/ngày (8am, 4pm, 8pm giờ VN) để bắt được conversion update của NV
  # State machine sẽ tự dedup, chỉ gửi Telegram khi có thay đổi
  schedule:
    - cron: '0 1,9,13 * * *'
  # Cho phép trigger tay từ tab Actions trên GitHub
  workflow_dispatch:
    inputs:
      force:
        description: 'Gửi lại Telegram dù state đã gửi (bỏ qua dedup)'
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google Service Account credentials
        env:
          GSA_JSON: ${{ secrets.GSA_JSON }}
        run: echo "$GSA_JSON" > gsa.json

      - name: Run weekly report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python vdg_report.py -y ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Cleanup credentials
        if: always()
        run: rm -f gsa.json
